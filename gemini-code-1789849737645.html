<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziva AI Hub & Self-Healing Assistant</title>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: #141722;
      --primary-purple: #8a2be2;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff66;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-glow: rgba(138, 43, 226, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(20, 23, 34, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glow);
    }

    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-green);
    }

    .model-selector {
      background: #1c2030;
      color: var(--text-main);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    nav.sidebar {
      width: 220px;
      background: #0f121d;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .nav-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background: rgba(138, 43, 226, 0.2);
      color: var(--text-main);
      border-left: 3px solid var(--neon-cyan);
    }

    main.content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .tab-content {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    .chips-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip:hover {
      background: var(--primary-purple);
      border-color: var(--neon-cyan);
    }

    .chat-box {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary-purple), #4a154b);
      color: #fff;
    }

    .message.assistant {
      align-self: flex-start;
      background: #1c2030;
      border: 1px solid var(--border-glow);
    }

    .repair-notice {
      font-size: 0.75rem;
      color: var(--neon-cyan);
      background: rgba(0,240,255,0.1);
      border-left: 2px solid var(--neon-cyan);
      padding: 4px 8px;
      margin-top: 6px;
      border-radius: 4px;
    }

    .input-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-bar input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
    }

    .btn-icon {
      background: #1c2030;
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-bar button.send-btn {
      background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
      border: none;
      color: white;
      padding: 0 20px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .agent-list {
      list-style: none;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agent-item {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="brand">✨ ZIVA AI HUB</div>
      <div class="status-badge">
        <div class="status-dot"></div> Auto-Repair Active
      </div>
    </div>
    
    <label for="headerModelSelect" class="sr-only">Select Engine Model</label>
    <select class="model-selector" id="headerModelSelect" aria-label="Select Engine Model">
      <option value="Gemini 2.5 Pro">Gemini 2.5 Pro</option>
      <option value="Claude Sonnet 4.5">Claude Sonnet 4.5</option>
      <option value="Grok Code Fast">Grok Code Fast</option>
      <option value="DeepSeek V3">DeepSeek V3</option>
      <option value="Llama 4 Maverick">Llama 4 Maverick</option>
    </select>
  </header>

  <div class="app-container">
    <nav class="sidebar" aria-label="Main Navigation">
      <button class="nav-btn active" onclick="switchTab('chat')">💬 Ziva Chat</button>
      <button class="nav-btn" onclick="switchTab('design-agent')">🛠️ Design AI Agent</button>
      <button class="nav-btn" onclick="switchTab('models')">🤖 Model Selector</button>
    </nav>

    <main class="content">
      <div id="tab-chat" class="tab-content active">
        <div class="chips-container">
          <button class="chip" onclick="fillPrompt('Generate a self-correcting JavaScript snippet')">🛠️ Auto-Fixing Code</button>
          <button class="chip" onclick="fillPrompt('Write and validate a clean HTML layout structure')">📄 Formatted Document</button>
        </div>

        <div class="chat-box" id="chatBox" role="log" aria-live="polite">
          <div class="message assistant">
            Hello! I'm Ziva. Autonomous auto-repair and self-healing logic are enabled across code, scripts, and documents.
          </div>
        </div>

        <div class="input-bar">
          <button class="btn-icon" aria-label="Attach File" onclick="toggleUploadModal()">➕</button>
          <label for="userInput" class="sr-only">Message Ziva</label>
          <input type="text" id="userInput" placeholder="Ask Ziva to write code, messages, or documents..." aria-label="Ask Ziva to write code, messages, or documents">
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
